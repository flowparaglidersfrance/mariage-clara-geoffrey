<style>
/* Layout : trois espaces. Joueur et grand écran gardent la carte « menu de mariage » ; l'animateur a un bandeau sombre avec onglets, façon back-office. */
:root{
  --ground:#F2EFE9; --paper:#FBF9F5; --ink:#2A1F2D; --ink-soft:#6E6270; --line:#D9D2CB;
  --accent:#A94F66; --accent-ink:#FBF9F5; --sage:#6F8C74; --sage-soft:#E3ECE4;
  --wrong:#B3443F; --wrong-soft:#F3DEDC; --gold:#B8933F; --mine:#F5E6EA;

  --font-body:"Figtree",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  --radius:18px;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --ground:#1B151E; --paper:#271E2B; --ink:#F1EAE6; --ink-soft:#B2A6AE; --line:#473B4B;
    --accent:#D9798F; --accent-ink:#1B151E; --sage:#8FB295; --sage-soft:#2A3A2D;
    --wrong:#E07A74; --wrong-soft:#452A2A; --gold:#D4B264; --mine:#3A2630;
    --bar:#120D14; --bar-ink:#F1EAE6; --bar-soft:#9A8E97;
  }
}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;box-sizing:border-box;-webkit-font-smoothing:antialiased}

.app{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.app.wide{max-width:900px}
h1,h2,h3{font-family:var(--font-display);font-weight:400;margin:0;text-wrap:balance;line-height:1.1}
p{margin:0}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;margin:0}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink-soft)}

.opt b{font-family:var(--font-display);font-style:italic;font-weight:400;color:var(--ink-soft);width:18px;flex:none;font-size:18px}
button.opt:not([disabled]):hover{border-color:var(--accent)}
.opt.chosen{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt.correct{background:var(--sage-soft);border-color:var(--sage)} .opt.wrong{background:var(--wrong-soft);border-color:var(--wrong)} .opt.dim{opacity:.55}

.board{display:grid;gap:6px}
.board .r{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid transparent}

.placecard{border:1px solid var(--line);border-radius:14px;padding:22px 18px;text-align:center;display:grid;gap:8px;background:var(--ground)}

/* Grand écran */
.screen .qtext{font-size:clamp(28px,4.5vw,46px)}

.screen .board .pos{font-size:32px} .screen .board .pts{font-size:34px} .screen .board .team span{font-size:14px}
.screen .verdict strong{font-size:clamp(22px,3vw,32px)} .screen .verdict p{font-size:clamp(16px,2vw,22px)}
@media (max-width:620px){.screen .options{grid-template-columns:1fr}}
.qr{display:grid;place-items:center;gap:8px;padding:14px;background:#fff;border-radius:14px;align-self:center}
.url{font-size:12px;word-break:break-all;color:var(--ink-soft);text-align:center}
.split{display:grid;grid-template-columns:1fr auto;gap:22px;align-items:start}

.chips{display:flex;flex-wrap:wrap;gap:8px}

.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:end}

.podium div:nth-child(2){order:1} .podium div:nth-child(3){order:3}

.podium b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.podium .pts{font-family:var(--font-display);font-size:28px;font-variant-numeric:tabular-nums}
/* Espace animateur */
.bar{background:var(--bar);color:var(--bar-ink);padding-inline:16px;padding-top:calc(10px + env(safe-area-inset-top,0px));position:sticky;top:0;z-index:5}
.bar .in{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.bar .head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.bar .brand{font-family:var(--font-display);font-style:italic;font-size:20px}
.bar .brand small{font-family:var(--font-body);font-style:normal;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--bar-soft);margin-left:10px}
.bar .links{display:flex;gap:6px;flex-wrap:wrap}
.bar .links a,.bar .links button{color:var(--bar-soft);font-size:13px;text-decoration:none;padding:6px 10px;border-radius:999px}

.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:10px}

.tabs a.on{background:var(--bar-ink);color:var(--bar)}
.admin{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:18px calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
.admin .card{padding:20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:2px}
.kpi b{font-family:var(--font-display);font-size:30px;font-weight:400;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:12px;color:var(--ink-soft)}
.kpi.warn b{color:var(--accent)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1 1 200px}
.qlist{display:grid;gap:8px}
.qrow{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--ground);border:1px solid var(--line)}
.qrow.current{border-color:var(--accent)}
.qrow .n{font-family:var(--font-display);font-style:italic;font-size:20px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.qrow .t{display:grid;gap:2px;min-width:0}
.qrow .t b{font-weight:500}
.qrow .t span{font-size:13px;color:var(--sage);font-weight:600}
.qrow .t span.anec{color:var(--ink-soft);font-weight:400;font-style:italic}
.qrow .ops{display:flex;gap:4px}
.icon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line);font-size:15px;color:var(--ink-soft)}
.icon:hover{border-color:var(--accent);color:var(--accent)}
.icon[disabled]{opacity:.3}
.edit{display:grid;gap:12px;padding:16px;border-radius:14px;border:1px solid var(--accent);background:var(--paper)}
.edit .opts{display:grid;gap:8px}
.edit .optrow{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:center}
.edit .optrow input[type=radio]{width:20px;height:20px;accent-color:var(--sage);padding:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.two{grid-template-columns:1fr}}
.inline-confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--ink-soft)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--bar);color:var(--bar-ink);padding:12px 18px;border-radius:999px;font-size:14px;z-index:20;max-width:90vw;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.toast.err{background:var(--wrong);color:#fff}
.pinbox{display:flex;gap:10px;justify-content:center}
.pinbox input{font-size:28px;letter-spacing:.5em;text-align:center;font-variant-numeric:tabular-nums;max-width:260px}
footer{text-align:center;font-size:12px;color:var(--ink-soft);display:flex;gap:14px;justify-content:center;flex-wrap:wrap}

<body>
<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ============================================================
   CONFIGURATION
   ============================================================ */
const SUPABASE = { url: "https://hjwnztxsalikcfzsrjds.supabase.co", key: "sb_publishable_i4an1uO0V54b8cLFOzk4zA_be39buWb" };
const COUPLE = { her: "Clare", him: "Geoffrey" };
const COURSES = ["Entrée", "Plat", "Dessert"];
const COURSE_SUB = { "Entrée": "Les débuts", "Plat": "La vie à deux", "Dessert": "Le grand jour" };
const SECONDS_CHOICES = [30, 45, 60, 90];
const RANKS = [
  [0.85, "Table des témoins", "Vous connaissez ce couple mieux qu'eux-mêmes."],
  [0.65, "Premier cercle", "On vous invite aux anniversaires sans hésiter."],
  [0.45, "Cousins attachants", "Vous avez l'essentiel. Le reste s'apprend au bar."],
  [0.25, "Pièces rapportées", "Encore quelques repas de famille et ce sera bon."],
  [0,    "Table du fond", "Vous êtes venus pour la fête, et c'est très bien aussi."],
];
const STATUS_LABEL = { lobby: "En attente", question: "Question ouverte", reveal: "Réponse révélée", board: "Classement", finished: "Partie terminée" };

/* ============================================================
   Outils
   ============================================================ */
const LETTERS = ["a", "b", "c", "d"];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const root = document.getElementById("root");
const sb = window.supabase.createClient(SUPABASE.url, SUPABASE.key);
const ls = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} },
};
let toastTimer = null;
function toast(msg, err){
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div"); t.className = "toast" + (err ? " err" : ""); t.textContent = msg; document.body.appendChild(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), err ? 5000 : 2600);
}
async function rpc(name, args){
  const { data, error } = await sb.rpc(name, args);
  if (error) throw error;
  return data;
}
function humanError(e){
  const m = (e && e.message) || "";
  if (/PIN/i.test(m)) return "Code PIN incorrect.";
  if (/plus ouverte/.test(m)) return "La question vient d'être fermée.";
  if (/Temps écoulé/.test(m)) return "Trop tard, le temps est écoulé.";
  if (/duplicate|23505/.test(m)) return "Déjà répondu.";
  if (/Failed to fetch|NetworkError|network/i.test(m)) return "Pas de réseau. Réessayez.";
  return m || "Une erreur est survenue.";
}

/* ---- Horloge serveur (pour un chrono identique partout) ---- */
let clockOffset = 0;
async function syncClock(){
  try { const t0 = Date.now(); const srv = await rpc("server_time"); const t1 = Date.now(); clockOffset = new Date(srv).getTime() - (t0 + t1) / 2; } catch (e) {}
}
const serverNow = () => Date.now() + clockOffset;
function remaining(game){
  if (!game || game.status !== "question" || !game.question_started_at) return 0;
  return Math.max(0, Math.ceil(game.seconds - (serverNow() - new Date(game.question_started_at).getTime()) / 1000));
}

/* ---- Données partagées : état de la partie, questions publiques, classement ---- */
const Live = {
  game: null, questions: [], board: [], counts: {}, connected: false,
  listeners: new Set(), channel: null, pollTimer: null,
  on(fn){ this.listeners.add(fn); return () => this.listeners.delete(fn); },
  emit(){ for (const fn of this.listeners) { try { fn(); } catch (e) { console.error(e); } } },
  async loadGame(){
    const { data } = await sb.from("game").select("*").eq("id", 1).single();
    if (data) { const changed = JSON.stringify(data) !== JSON.stringify(this.game); this.game = data; if (changed) this.emit(); }
  },
  async loadQuestions(){ const { data } = await sb.from("questions_public").select("*").order("position"); if (data) { this.questions = data; this.emit(); } },
  async loadBoard(){
    const [{ data: b }, { data: c }] = await Promise.all([sb.from("leaderboard").select("*"), sb.from("answer_counts").select("*")]);
    const prev = JSON.stringify([this.board, this.counts]);
    if (b) this.board = b.sort((x, y) => y.score - x.score || y.answered - x.answered || x.name.localeCompare(y.name));
    if (c) this.counts = Object.fromEntries(c.map(r => [r.question_id, r.answered]));
    if (JSON.stringify([this.board, this.counts]) !== prev) this.emit();
  },
  async start(){
    await Promise.all([this.loadGame(), this.loadQuestions(), this.loadBoard(), syncClock()]);
    this.channel = sb.channel("live")
      .on("postgres_changes", { event: "*", schema: "public", table: "game" }, p => { if (p.new && p.new.id) { this.game = p.new; this.emit(); this.loadBoard(); } })
      .on("postgres_changes", { event: "*", schema: "public", table: "teams" }, () => this.loadBoard())
      .subscribe(status => { this.connected = status === "SUBSCRIBED"; this.emit(); });
    // Filet de sécurité si le wifi de la salle coupe le temps réel
    this.pollTimer = setInterval(() => { this.loadGame(); this.loadBoard(); }, 4000);
  },
  current(){ return this.game && this.game.current_question_id ? this.questions.find(q => q.id === this.game.current_question_id) : null; },
  idx(){ const q = this.current(); return q ? this.questions.indexOf(q) : -1; },
  isCourseEnd(q){ const i = this.questions.indexOf(q); return i === this.questions.length - 1 || (i >= 0 && this.questions[i + 1].course !== q.course); },
};

/* ============================================================
   Routeur (ancre : #/jouer, #/connexion, #/animateur/..., #/ecran)
   ============================================================ */
function route(){ const h = location.hash.replace(/^#\/?/, ""); return h.split("/").filter(Boolean); }
let currentView = null, viewTick = null, unsubLive = null;
function mount(view){
  clearInterval(viewTick); viewTick = null;
  if (unsubLive) { unsubLive(); unsubLive = null; }
  currentView = view;
  document.body.className = view.bodyClass || "";
  view.render();
  unsubLive = Live.on(() => { if (view.tab === "questions" && Admin.editing) return; view.render(); });
  if (view.tick) viewTick = setInterval(() => view.tick(), 1000);
  window.scrollTo(0, 0);
}
function navigate(){
  const [a, b] = route();
  if (a === "connexion") return mount(LoginView);
  if (a === "animateur") { if (!Admin.pin()) { location.replace("#/connexion"); return; } return mount(AdminView(b || "partie")); }
  if (a === "ecran") return mount(ScreenView);
  return mount(PlayerView);
}

const CIRC = 2 * Math.PI * 19;
function timerHTML(game, big){
  const left = remaining(game), total = game.seconds || 45;
  return `<div class="timer ${big ? "big" : ""} ${left <= 8 ? "hurry" : ""}" data-timer><svg viewBox="0 0 44 44"><circle class="track" cx="22" cy="22" r="19"/><circle class="arc" cx="22" cy="22" r="19" stroke-dasharray="${CIRC}" stroke-dashoffset="${CIRC * (1 - left / total)}"/></svg><span>${left}</span></div>`;
}
function updateTimers(game){
  const left = remaining(game), total = game.seconds || 45;
  document.querySelectorAll("[data-timer]").forEach(t => { t.classList.toggle("hurry", left <= 8); t.querySelector(".arc").style.strokeDashoffset = CIRC * (1 - left / total); t.querySelector("span").textContent = left; });
}
function boardHTML(rows, mineId, limit){
  if (!rows.length) return `<div class="empty">Aucune table inscrite pour le moment.</div>`;
  const shown = limit ? rows.slice(0, limit) : rows;
  const mine = rows.findIndex(r => r.id === mineId);
  let html = shown.map((r, k) => rowHTML(r, k, mineId)).join("");
  if (mineId && mine >= shown.length) html += `<div class="empty" style="padding:4px">…</div>` + rowHTML(rows[mine], mine, mineId);
  return html;
}
function rowHTML(r, k, mineId){
  return `<div class="r ${r.id === mineId ? "mine" : ""} ${k === 0 && r.score > 0 ? "top" : ""}">
    <span class="pos">${k + 1}</span>
    <span class="team"><b>${esc(r.name)}</b><span>${r.table_no ? `table ${esc(r.table_no)} · ` : ""}${r.answered} réponse${r.answered > 1 ? "s" : ""}</span></span>
    <span class="pts">${r.score}</span></div>`;
}
function courseTitle(q){ return q ? `${q.course} · ${COURSE_SUB[q.course] || ""}` : ""; }
function afterCourse(q){ return q ? ` après ${q.course === "Entrée" ? "l'" : "le "}${q.course.toLowerCase()}` : ""; }
function qrInto(el, text){ try { if (window.QRCode && el) new QRCode(el, { text, width: 180, height: 180, colorDark: "#2A1F2D", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M }); } catch (e) {} }
const baseURL = () => location.origin + location.pathname;
const playerURL = () => baseURL() + "#/jouer";

/* ---- Onglet Partie ---- */
function renderPartie(el){
  ensureAdminQuestions();
  const g = Live.game, qs = Live.questions, q = Live.current(), i = Live.idx(), n = Live.board.length;
  const answered = q ? (Live.counts[q.id] || 0) : 0;
  const next = i >= 0 ? qs[i + 1] : qs[0];
  const last = q && i === qs.length - 1;
  const courseEnd = q && Live.isCourseEnd(q);
  const full = q ? Admin.questions.find(x => x.id === q.id) : null;
  let main = "", secondary = "";
  if (!qs.length) main = `<p class="notice err">Aucune question. Ajoutez-en dans l'onglet Questions.</p>`;
  else if (g.status === "lobby") main = `<button class="btn btn-primary" data-act="start">Lancer la question 1</button>`;
  else if (g.status === "question") { main = `<button class="btn btn-primary" data-act="reveal">Clore et révéler la réponse</button>`; secondary = `<button class="btn btn-ghost" data-act="restart">Relancer le chrono</button>`; }
  else if (g.status === "reveal") {
    main = courseEnd ? `<button class="btn btn-primary" data-act="board">Afficher le classement</button>` : `<button class="btn btn-primary" data-act="next">Question suivante (${i + 2})</button>`;
    secondary = courseEnd && !last ? `<button class="btn btn-ghost" data-act="next">Passer directement à la question ${i + 2}</button>` : "";
  }
  else if (g.status === "board") main = last ? `<button class="btn btn-primary" data-act="finish">Terminer la partie</button>` : `<button class="btn btn-primary" data-act="next">Lancer la question ${i + 2}${next ? ` · ${esc(next.course)}` : ""}</button>`;
  else if (g.status === "finished") main = `<button class="btn btn-ghost" data-act="lobby">Revenir à l'accueil</button>`;

  el.innerHTML = `
  <div class="kpis">
    <div class="kpi"><b>${n}</b><span>tables inscrites</span></div>
    <div class="kpi ${g.status === "question" && answered < n ? "warn" : ""}"><b>${q ? `${answered}/${n}` : "–"}</b><span>réponses sur la question</span></div>
    <div class="kpi"><b>${i >= 0 ? i + 1 : 0}/${qs.length}</b><span>questions jouées</span></div>
    <div class="kpi"><b id="kpi-left">${g.status === "question" ? remaining(g) + " s" : "–"}</b><span>temps restant</span></div>
  </div>
  <section class="card fade">
    <div class="topbar">
      <span class="pill ${g.status}"><i></i>${STATUS_LABEL[g.status]}</span>
      <span class="live ${Live.connected ? "" : "off"}"><i></i>${Live.connected ? "temps réel actif" : "temps réel coupé, mise à jour toutes les 4 s"}</span>
    </div>
    ${q ? `
      <div><p class="eyebrow">${esc(courseTitle(q))} · question ${i + 1} sur ${qs.length}</p><h2 style="font-size:24px;margin-top:6px">${esc(q.text)}</h2></div>
      <div class="options">${q.options.map((o, k) => `<div class="opt ${full && k === full.correct ? "correct" : ""}"><b>${LETTERS[k]}.</b><span>${esc(o)}</span>${full && k === full.correct ? `<span style="margin-left:auto;font-size:12px;color:var(--sage);font-weight:600">BONNE RÉPONSE</span>` : ""}</div>`).join("")}</div>
      ${full && full.anecdote ? `<p class="notice" style="text-align:left">À lire : ${esc(full.anecdote)}</p>` : ""}
    ` : g.status === "lobby" ? `<div><h2 style="font-size:24px">Les tables s'inscrivent</h2><p style="color:var(--ink-soft);margin-top:6px">Projetez le grand écran pour afficher le QR code. Première question : « ${esc(qs[0] ? qs[0].text : "")} ».</p></div>`
      : `<div><h2 style="font-size:24px">Partie terminée</h2><p style="color:var(--ink-soft);margin-top:6px">Le podium est affiché sur le grand écran.</p></div>`}
    <div class="actions">${main}${secondary}</div>
    <div class="topbar" style="flex-wrap:wrap">
      <label style="flex-direction:row;align-items:center;gap:10px">Temps par question
        <select id="seconds" style="width:auto;padding:8px 12px;font-size:15px">${SECONDS_CHOICES.map(s => `<option value="${s}" ${s === g.seconds ? "selected" : ""}>${s} s</option>`).join("")}</select>
      </label>
      ${g.status !== "lobby" ? `<button class="btn btn-ghost btn-sm" data-act="lobby">Retour à l'accueil</button>` : ""}
    </div>
  </section>
  ${g.status === "question" ? `<div class="topbar" style="justify-content:center">${timerHTML(g, true)}</div>` : ""}`;

  el.querySelector("#seconds").addEventListener("change", async e => { await setGame(g.status, g.current_question_id, +e.target.value); toast("Temps par question : " + e.target.value + " s"); });
  el.addEventListener("click", async e => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const act = b.dataset.act; b.disabled = true;
    if (act === "start") await setGame("question", qs[0].id);
    else if (act === "restart") await setGame("question", q.id);
    else if (act === "reveal") await setGame("reveal", q.id);
    else if (act === "board") await setGame("board", q.id);
    else if (act === "next") { if (next) await setGame("question", next.id); }
    else if (act === "finish") await setGame("finished", q.id);
    else if (act === "lobby") await setGame("lobby", null);
  });
}

/* ---- Onglet Questions ---- */
function renderQuestions(el){
  ensureAdminQuestions();
  const qs = Admin.questions;
  const cur = Live.game && Live.game.current_question_id;
  const groups = COURSES.map(c => [c, qs.filter(q => q.course === c)]);
  el.innerHTML = `
  <section class="card fade">
    <div class="topbar"><div><h2 style="font-size:22px">Questions</h2><p style="color:var(--ink-soft);font-size:14px">${qs.length} au total · un classement est proposé à la fin de chaque service.</p></div>
      <button class="btn btn-primary btn-sm" id="add" ${Admin.editing ? "disabled" : ""}>Ajouter</button></div>
    ${Admin.editing && Admin.editing.id === null ? editorHTML(Admin.editing) : ""}
    ${!qs.length && Admin.loadingQ ? `<div class="empty">Chargement…</div>` : ""}
    ${groups.map(([c, list]) => `
      <p class="eyebrow" style="margin-top:6px">${c} · ${COURSE_SUB[c]} · ${list.length}</p>
      <div class="qlist">${list.length ? list.map(q => Admin.editing && Admin.editing.id === q.id ? editorHTML(Admin.editing) : `
        <div class="qrow ${q.id === cur ? "current" : ""}" data-id="${q.id}">
          <span class="n">${qs.indexOf(q) + 1}</span>
          <span class="t"><b>${esc(q.text)}</b><span>${esc(q.options[q.correct])}</span>${q.anecdote ? `<span class="anec">${esc(q.anecdote)}</span>` : ""}</span>
          <span class="ops">
            <button class="icon" data-op="up" title="Monter" ${qs.indexOf(q) === 0 ? "disabled" : ""}>↑</button>
            <button class="icon" data-op="down" title="Descendre" ${qs.indexOf(q) === qs.length - 1 ? "disabled" : ""}>↓</button>
            <button class="icon" data-op="edit" title="Modifier">✎</button>
            <button class="icon" data-op="del" title="Supprimer">✕</button>
          </span>
        </div>
        ${Admin.confirm === q.id ? `<div class="inline-confirm">Supprimer cette question ? <button class="btn btn-danger btn-sm" data-op="del-yes" data-id="${q.id}">Oui, supprimer</button><button class="btn btn-ghost btn-sm" data-op="del-no">Annuler</button></div>` : ""}`).join("") : `<div class="empty" style="padding:8px">Aucune question dans ce service.</div>`}</div>`).join("")}
  </section>`;
  el.querySelector("#add").addEventListener("click", () => { Admin.editing = { id: null, course: "Entrée", text: "", options: ["", "", "", ""], correct: 0, anecdote: "" }; currentView.render(); });
  el.addEventListener("click", async e => {
    const b = e.target.closest("[data-op]"); if (!b) return;
    const row = b.closest("[data-id]"); const id = b.dataset.id || (row && row.dataset.id); const q = qs.find(x => x.id === id);
    const op = b.dataset.op;
    try {
      if (op === "edit") { Admin.editing = { ...q, options: [...q.options] }; Admin.confirm = null; currentView.render(); }
      else if (op === "del") { Admin.confirm = id; currentView.render(); }
      else if (op === "del-no") { Admin.confirm = null; currentView.render(); }
      else if (op === "del-yes") { await rpc("admin_delete_question", { p_pin: Admin.pin(), p_id: id }); Admin.confirm = null; await reloadQuestions(); toast("Question supprimée"); }
      else if (op === "up" || op === "down") {
        const ids = qs.map(x => x.id); const k = ids.indexOf(id); const j = op === "up" ? k - 1 : k + 1;
        if (j < 0 || j >= ids.length) return;
        [ids[k], ids[j]] = [ids[j], ids[k]];
        await rpc("admin_reorder_questions", { p_pin: Admin.pin(), p_ids: ids });
        // le service suit la nouvelle place : on aligne sur le voisin échangé
        const moved = qs.find(x => x.id === id), neighbour = qs.find(x => x.id === ids[k]);
        if (moved && neighbour && moved.course !== neighbour.course) await rpc("admin_save_question", { p_pin: Admin.pin(), p_id: moved.id, p_position: j + 1, p_course: neighbour.course, p_text: moved.text, p_options: moved.options, p_correct: moved.correct, p_anecdote: moved.anecdote });
        await reloadQuestions();
      }
      else if (op === "cancel") { Admin.editing = null; currentView.render(); }
      else if (op === "save") await saveEditor(el);
    } catch (err) { toast(humanError(err), true); }
  });
}
function editorHTML(q){
  return `<form class="edit fade" id="editor" data-id="${q.id || ""}">
    <div class="two">
      <label>Service<select id="e-course">${COURSES.map(c => `<option ${c === q.course ? "selected" : ""}>${c}</option>`).join("")}</select></label>
      <label>Anecdote lue après la réponse<input id="e-anecdote" maxlength="500" value="${esc(q.anecdote)}" placeholder="Facultatif"></label>
    </div>
    <label>Question<textarea id="e-text" maxlength="300" required>${esc(q.text)}</textarea></label>
    <div class="opts">
      <p class="eyebrow">Réponses · cochez la bonne</p>
      ${q.options.map((o, k) => `<div class="optrow"><input type="radio" name="correct" value="${k}" ${k === q.correct ? "checked" : ""} aria-label="Bonne réponse ${LETTERS[k]}"><input id="e-opt-${k}" maxlength="80" required value="${esc(o)}" placeholder="Réponse ${LETTERS[k]}"></div>`).join("")}
    </div>
    <div class="actions"><button class="btn btn-primary" type="button" data-op="save">${q.id ? "Enregistrer" : "Ajouter la question"}</button><button class="btn btn-ghost" type="button" data-op="cancel">Annuler</button></div>
  </form>`;
}
async function saveEditor(el){
  const f = el.querySelector("#editor"); if (!f) return;
  const text = f.querySelector("#e-text").value.trim();
  const options = [0, 1, 2, 3].map(k => f.querySelector("#e-opt-" + k).value.trim());
  const checked = f.querySelector("input[name=correct]:checked");
  const correct = checked ? +checked.value : NaN;
  const course = f.querySelector("#e-course").value, anecdote = f.querySelector("#e-anecdote").value.trim();
  if (!text || options.some(o => !o) || Number.isNaN(correct)) { toast("Question, quatre réponses et une bonne réponse cochée sont nécessaires.", true); return; }
  const id = f.dataset.id || null;
  const existing = Admin.questions.find(q => q.id === id);
  // Nouvelle question : à la fin de son service
  const lastOfCourse = Admin.questions.filter(q => q.course === course).map(q => q.position).reduce((m, p) => Math.max(m, p), 0);
  const position = existing ? existing.position : (lastOfCourse || Admin.questions.length) + 1;
  await rpc("admin_save_question", { p_pin: Admin.pin(), p_id: id, p_position: position, p_course: course, p_text: text, p_options: options, p_correct: correct, p_anecdote: anecdote });
  Admin.editing = null;
  await reloadQuestions(true);
  toast(id ? "Question enregistrée" : "Question ajoutée");
}
async function reloadQuestions(renumber){
  await Admin.loadQuestions();
  // Ordre : service, puis position, puis date de création (une question ajoutée se place en fin de service)
  const order = [...Admin.questions].sort((a, b) => COURSES.indexOf(a.course) - COURSES.indexOf(b.course) || a.position - b.position || (a.created_at < b.created_at ? -1 : 1));
  if (renumber || order.some((q, k) => q.position !== k + 1)) {
    await rpc("admin_reorder_questions", { p_pin: Admin.pin(), p_ids: order.map(q => q.id) });
    await Admin.loadQuestions();
  }
  await Live.loadQuestions();
  if (currentView) currentView.render();
}

/* ---- Onglet Tables ---- */
function renderTables(el){
  const rows = Live.board;
  el.innerHTML = `
  <section class="card fade">
    <div class="topbar"><div><h2 style="font-size:22px">Tables inscrites</h2><p style="color:var(--ink-soft);font-size:14px">${rows.length} table${rows.length > 1 ? "s" : ""} · classement en direct</p></div><span class="live ${Live.connected ? "" : "off"}"><i></i>en direct</span></div>
    <div class="qlist">${rows.length ? rows.map((r, k) => `
      <div class="qrow" data-id="${r.id}">
        <span class="n">${k + 1}</span>
        <span class="t"><b>${esc(r.name)}${r.table_no ? ` <span style="color:var(--ink-soft);font-weight:400">· table ${esc(r.table_no)}</span>` : ""}</b><span style="color:var(--ink-soft);font-weight:400">${r.score} points · ${r.answered} réponse${r.answered > 1 ? "s" : ""}</span></span>
        <span class="ops"><button class="icon" data-op="del" title="Retirer">✕</button></span>
      </div>
      ${Admin.confirm === r.id ? `<div class="inline-confirm">Retirer « ${esc(r.name)} » et ses réponses ? <button class="btn btn-danger btn-sm" data-op="del-yes" data-id="${r.id}">Oui, retirer</button><button class="btn btn-ghost btn-sm" data-op="del-no">Annuler</button></div>` : ""}`).join("") : `<div class="empty">Aucune table pour l'instant. Le QR code est sur le grand écran.</div>`}</div>
  </section>`;
  el.addEventListener("click", async e => {
    const b = e.target.closest("[data-op]"); if (!b) return;
    const id = b.dataset.id || b.closest("[data-id]").dataset.id;
    try {
      if (b.dataset.op === "del") { Admin.confirm = id; currentView.render(); }
      else if (b.dataset.op === "del-no") { Admin.confirm = null; currentView.render(); }
      else if (b.dataset.op === "del-yes") { await rpc("admin_delete_team", { p_pin: Admin.pin(), p_id: id }); Admin.confirm = null; await Live.loadBoard(); toast("Table retirée"); }
    } catch (err) { toast(humanError(err), true); }
  });
}

/* ---- Onglet Réglages ---- */
function renderReglages(el){
  el.innerHTML = `
  <section class="card fade">
    <h2 style="font-size:22px">Code d'accès</h2>
    <form id="pinform" class="two">
      <label>Nouveau code (4 à 8 chiffres)<input id="np1" inputmode="numeric" pattern="[0-9]{4,8}" maxlength="8" required autocomplete="off"></label>
      <label>Confirmer<input id="np2" inputmode="numeric" pattern="[0-9]{4,8}" maxlength="8" required autocomplete="off"></label>
      <button class="btn btn-primary" type="submit" style="grid-column:1/-1">Changer le code</button>
    </form>
  </section>
  <section class="card fade">
    <h2 style="font-size:22px">Remise à zéro</h2>
    <p style="color:var(--ink-soft)">Efface toutes les tables et leurs réponses, remet la partie en attente. Les questions sont conservées. À faire juste avant le repas, après vos essais.</p>
    ${Admin.confirm === "reset" ? `<div class="inline-confirm">Vraiment tout effacer ? <button class="btn btn-danger btn-sm" id="reset-yes">Oui, tout effacer</button><button class="btn btn-ghost btn-sm" id="reset-no">Annuler</button></div>` : `<div class="actions"><button class="btn btn-danger" id="reset">Effacer les tables et les scores</button></div>`}
  </section>
  <section class="card fade">
    <h2 style="font-size:22px">Liens utiles</h2>
    <p style="color:var(--ink-soft);font-size:14px">Lien des tables, à transformer en QR code pour les cartons :</p>
    <p class="url" style="text-align:left">${esc(playerURL())}</p>
    <p style="color:var(--ink-soft);font-size:14px">Grand écran, à ouvrir sur l'ordinateur branché au vidéoprojecteur :</p>
    <p class="url" style="text-align:left">${esc(baseURL() + "#/ecran")}</p>
    <p style="color:var(--ink-soft);font-size:14px">Barème : 100 points par bonne réponse, jusqu'à 50 points de bonus selon la rapidité. Les réponses arrivées après le temps imparti ne comptent pas.</p>
  </section>`;
  el.querySelector("#pinform").addEventListener("submit", async e => {
    e.preventDefault();
    const a = el.querySelector("#np1").value, b = el.querySelector("#np2").value;
    if (a !== b) { toast("Les deux codes ne correspondent pas.", true); return; }
    try { await rpc("admin_change_pin", { p_pin: Admin.pin(), p_new: a }); Admin.setPin(a); toast("Code modifié"); e.target.reset(); }
    catch (err) { toast(humanError(err), true); }
  });
  const r = el.querySelector("#reset"); if (r) r.addEventListener("click", () => { Admin.confirm = "reset"; currentView.render(); });
  const y = el.querySelector("#reset-yes"); if (y) y.addEventListener("click", async () => { try { await rpc("admin_reset", { p_pin: Admin.pin() }); Admin.confirm = null; await Live.loadGame(); await Live.loadBoard(); toast("Partie remise à zéro"); } catch (err) { toast(humanError(err), true); } });
  const no = el.querySelector("#reset-no"); if (no) no.addEventListener("click", () => { Admin.confirm = null; currentView.render(); });
}

/* ============================================================
   Démarrage
   ============================================================ */
(async function boot(){
  if (!location.hash) history.replaceState(null, "", "#/jouer");
  navigate();
  try { await Live.start(); } catch (e) { console.error(e); toast("Connexion à la partie impossible. Vérifiez le réseau.", true); }
  navigate();
})();
</script>
